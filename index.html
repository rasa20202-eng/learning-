<!doctype html>
<html>
  <head>
    <title>Моя первая страница</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="mainTitle">Привет, мир!</h1>
    </header>
    <main>
      <h2>Мои цели</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
      <p>Мой любимый сайт: <a href="https://www.youtube.com">YouTube</a></p>

      <p>Это моя первая страница,она сделана вручную</p>
      <p>Без мыслей</p>
      <p>Вы нажали: <span id="clickCount">0</span> раз</p>
      <button id="myButton">Нажми на меня</button>
      <input type="text" id="nameInput" placeholder="Введите ваше имя">
      <button id="greetBtn">Поздороваться</button>
      <button id="renderGoalsBtn">Показать мои цели</button>
      <div id="goalsContainer"></div>
      <form id="goalForm"><
      <input type="text" id="newGoalInput" placeholder="Новая цель...">
<button id="addGoalBtn">Добавить</button>
      </form>
    </main>
    <footer>
      <p>Моя первая страница, 2026</p>
    </footer>
    <script>
      const button = document.getElementById("myButton");
      const title = document.getElementById("mainTitle");
      const counter = document.getElementById("clickCount");
      let count = 0;

      // Первая кнопка (счетчик и фон)
      button.addEventListener("click", function () {
        if (document.body.style.backgroundColor === "lightgreen") {
          document.body.style.backgroundColor = "lightyellow";
          title.textContent = "Привет, мир!";
        } else {
          document.body.style.backgroundColor = "lightgreen";
          title.textContent = "Кнопка нажата! JS работает!";
        }
        count = count + 1;
        counter.textContent = count;
      });

      const renderGoalsBtn = document.getElementById("renderGoalsBtn");
const goalsContainer = document.getElementById("goalsContainer");
const newGoalInput = document.getElementById("newGoalInput");
const goalForm = document.getElementById("goalForm");

const myGoals = ["Выучить HTML", "Выучить CSS", "Выучить JavaScript", "Стать менеджером"];
function renderGoals() {
  goalsContainer.textContent = "";
  for (let i = 0; i < myGoals.length; i++) {
    const goalElement = document.createElement("p");
    goalElement.textContent = myGoals[i];
    goalsContainer.appendChild(goalElement);
  }
}
renderGoalsBtn.addEventListener("click", renderGoals);
goalForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const newGoal = newGoalInput.value; 
  
  if (newGoal !== "") {               
    myGoals.push(newGoal);            
    newGoalInput.value = "";          
    renderGoals();                    
  }
});

</script>
</body>
</html>
